<div id="calc">
  <div id="calc-prompt" hidden>{{Prompt}}</div>
  <div id="calc-kind" hidden>{{Kind}}</div>
  <div id="calc-params" hidden>{{Params}}</div>
  <div id="calc-q" class="calc-q"></div>
  <div id="calc-round" class="calc-round"></div>
  <input id="calc-in" class="calc-in" type="text" inputmode="decimal" autocomplete="off" autocorrect="off"
         autocapitalize="off" spellcheck="false" placeholder="Your answer">
</div>
<div class="calc-hint">Work it on paper, type your answer, then show the answer. These numbers are new each review.</div>

<!-- calc.js -->
